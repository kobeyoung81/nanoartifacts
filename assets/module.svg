<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="nanoartifacts: agents and browsers in, metadata and GridFS bodies out">
  <title>nanoartifacts</title>
  <defs>
    <style>
      .txt { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .chip { fill: #F1F5F9; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; }
      .wire { stroke: #CBD5E1; stroke-width: 2; }
      .ink { fill: #0F172A; }
      .dim { fill: #64748B; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#FFFFFF"/>

  <g class="txt" font-size="13" fill="#334155" text-anchor="middle">
    <rect class="chip" x="200" y="40" width="240" height="36" rx="10"/><text x="320" y="63">agent container · MCP</text>
    <rect class="chip" x="520" y="40" width="240" height="36" rx="10"/><text x="640" y="63">browser · JWT or preview cookie</text>
  </g>

  <g class="wire">
    <line x1="320" y1="76" x2="320" y2="100"/>
    <line x1="640" y1="76" x2="640" y2="100"/>
    <line x1="320" y1="100" x2="640" y2="100"/>
    <line x1="480" y1="100" x2="480" y2="120"/>
  </g>

  <rect x="260" y="120" width="440" height="56" rx="12" fill="#EEF2FF" stroke="#2F6BFF" stroke-width="2.5"/>
  <text class="txt ink" x="480" y="144" font-size="15" font-weight="700" text-anchor="middle">nanoartifacts</text>
  <text class="txt dim" x="480" y="163" font-size="10.5" text-anchor="middle">spaces · tree · versions · grants · MCP · its own front end</text>

  <g class="wire">
    <line x1="480" y1="176" x2="480" y2="200"/>
    <line x1="320" y1="200" x2="640" y2="200"/>
    <line x1="320" y1="200" x2="320" y2="228"/>
    <line x1="640" y1="200" x2="640" y2="228"/>
  </g>

  <rect x="180" y="228" width="280" height="52" rx="10" class="card"/>
  <text class="mono" x="320" y="250" font-size="11" fill="#334155" text-anchor="middle">artifacts, artifacts_versions,</text>
  <text class="mono" x="320" y="266" font-size="11" fill="#334155" text-anchor="middle">artifacts_spaces, artifacts_nodes …</text>

  <rect x="500" y="228" width="280" height="52" rx="10" class="card"/>
  <text class="mono" x="640" y="250" font-size="11" fill="#334155" text-anchor="middle">artifacts_fs.files</text>
  <text class="mono" x="640" y="266" font-size="11" fill="#334155" text-anchor="middle">artifacts_fs.chunks</text>

  <text class="txt dim" x="480" y="312" font-size="11" text-anchor="middle">the body is content-addressed: its sha256 is the file id, so identical bytes are stored and charged once</text>

  <rect x="180" y="334" width="600" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g class="txt" font-size="10.5" fill="#475569">
    <text x="200" y="354">the page is /artifacts (the portal); the app and its API are /nanoartifacts/ (this service);</text>
    <text x="200" y="371">delete is soft — the collector removes a body only when nothing references it.</text>
  </g>
</svg>
